<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agenda de turnos | El Rincón</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#111;color:white;padding:18px}
.contenedor{max-width:950px;margin:auto}
h1{text-align:center;margin:10px 0}
p{text-align:center;color:#ccc}
.agenda{display:grid;grid-template-columns:75px repeat(6,minmax(90px,1fr));gap:5px;overflow-x:auto;margin-top:25px}
.celda{min-width:90px;min-height:58px;padding:12px 6px;border-radius:8px;text-align:center;background:#292929}
.encabezado{background:#444;font-weight:bold}
.hora{background:#333;font-weight:bold}
.disponible{background:#214f2b;cursor:pointer}
.disponible:hover{background:#32663d}
.seleccionado{background:white!important;color:#111}
button{display:block;margin:25px auto;padding:14px 24px;border:0;border-radius:10px;background:white;color:#111;font-weight:bold;font-size:16px}
#mensaje{text-align:center;color:#ddd}
</style>
</head>
<body>
<div class="contenedor">
<h1>📅 Agenda de turnos</h1>
<p>Elegí un día y un horario de 13:00 a 18:00.</p>
<div id="agenda" class="agenda"></div>
<p id="mensaje">Ningún horario seleccionado.</p>
<button onclick="confirmar()">Confirmar turno</button>
</div>

<script>
const dias=["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
const horarios=["13:00","14:00","15:00","16:00","17:00","18:00"];
let elegido=null;
const agenda=document.getElementById("agenda");

agenda.innerHTML='<div class="celda encabezado">Hora</div>'+
dias.map(d=>'<div class="celda encabezado">'+d+'</div>').join("");

horarios.forEach(h=>{
agenda.innerHTML+='<div class="celda hora">'+h+'</div>';
dias.forEach(d=>{
agenda.innerHTML+='<div class="celda disponible" data-dia="'+d+'" data-hora="'+h+'" onclick="seleccionar(this)">Disponible</div>';
});
});

function seleccionar(el){
document.querySelectorAll(".seleccionado").forEach(x=>x.classList.remove("seleccionado"));
el.classList.add("seleccionado");
elegido={dia:el.dataset.dia,hora:el.dataset.hora};
document.getElementById("mensaje").textContent="Turno seleccionado: "+elegido.dia+" a las "+elegido.hora;
}

function confirmar(){
if(!elegido){alert("Primero elegí un horario.");return;}
const texto=encodeURIComponent("Hola, quiero reservar un corte en El Rincón para el "+elegido.dia+" a las "+elegido.hora+".");
window.location.href="https://wa.me/542645647593?text="+texto;
}
</script>
</body>
</html>
